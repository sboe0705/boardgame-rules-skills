name: Release

# Push a version tag to publish a release, e.g. with ./release.sh or:
#   git tag -a v1.0.0 -m v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install zip
        run: command -v zip || (sudo apt-get update && sudo apt-get install -y zip)

      - name: Validate and package skills
        run: ./build.sh

      # one zip per skill plus the checksums, each attached as its own asset
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
