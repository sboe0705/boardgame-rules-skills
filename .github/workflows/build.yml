name: Build skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: command -v zip || (sudo apt-get update && sudo apt-get install -y zip)

      - name: Validate and package skills
        run: ./build.sh

      - name: Upload skill packages
        uses: actions/upload-artifact@v4
        with:
          name: skills
          path: dist/
          if-no-files-found: error
